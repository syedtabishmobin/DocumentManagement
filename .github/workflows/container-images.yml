name: Build Azure development images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-images.yml"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "src/apps/api/**"
      - "src/apps/web/**"
      - "src/packages/**"
      - ".agents/config/contacts.json"
      - ".agents/config/notifications.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: src/apps/api/Dockerfile
            image: doculyra-api
          - service: web
            dockerfile: src/apps/web/Dockerfile
            image: doculyra-web
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Azure with repository OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate Docker to the development registry
        run: az acr login --name "${{ secrets.AZURE_ACR_NAME }}"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ matrix.image }}:dev-${{ github.sha }}
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ matrix.image }}:dev-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
