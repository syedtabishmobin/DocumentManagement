name: Phase 1 quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specifications-and-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: doculyra_test
          POSTGRES_USER: doculyra_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doculyra_test -d doculyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DM_TEST_POSTGRES_URL: postgresql://doculyra_test:synthetic-test-password@127.0.0.1:5432/doculyra_test
      DM_TEST_POSTGRES_ALLOW_SCHEMA_RESET: enabled
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate framework, specifications, TypeScript and tests
        run: pnpm verify
      - name: Compile Azure Bicep
        run: az bicep build --file infra/main.bicep --outfile "${RUNNER_TEMP}/doculyra-main.json"

  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  flutter-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --simulator --no-codesign
